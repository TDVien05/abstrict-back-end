name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: Build, test, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: abstrict_ci
          POSTGRES_USER: abstrict
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abstrict -d abstrict_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # EF tooling and the app only relax their secret requirements in Development.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=abstrict_ci;Username=abstrict;Password=ci-only-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Abstrict.sln

      - name: Build
        run: dotnet build Abstrict.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Abstrict.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      # Fails when the EF model changed without a matching migration.
      - name: Check for missing migrations
        run: dotnet ef migrations has-pending-model-changes --project src/Abstrict.Api --configuration Release --no-build

      # Applies every migration to an empty PostgreSQL 16 database, the same engine as docker-compose.
      - name: Apply migrations
        run: dotnet ef database update --project src/Abstrict.Api --configuration Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
